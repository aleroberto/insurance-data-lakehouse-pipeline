version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: insurance_postgres
    environment:
      POSTGRES_USER: insurance_user
      POSTGRES_PASSWORD: insurance_pass
      POSTGRES_DB: insurance_dw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: insurance_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  spark:
    build: .
    container_name: insurance_spark
    ports:
      - "8081:8080"
    volumes:
      - ./:/app
    working_dir: /app
    command: tail -f /dev/null
    environment:
      - PYTHONPATH=/app/src

volumes:
  postgres_data:
  minio_data: